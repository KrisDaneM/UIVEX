<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">UIVEX interactive React component studio</title>
  <desc id="desc">A polished metallic interface preview with UIVEX branding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05080b"/><stop offset=".55" stop-color="#101820"/><stop offset="1" stop-color="#1d2830"/></linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#344550"/><stop offset=".27" stop-color="#fff"/><stop offset=".45" stop-color="#8fafc5"/><stop offset=".7" stop-color="#e8eff4"/><stop offset="1" stop-color="#344550"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#e8eff4" stop-opacity=".35"/><stop offset="1" stop-color="#05080b" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8fafc5" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="810" cy="250" rx="450" ry="330" fill="url(#light)"/>
  <path d="M-60 510C180 400 325 620 590 492s422-57 690-238" fill="none" stroke="url(#chrome)" stroke-width="44" stroke-linecap="round" opacity=".32" filter="url(#glow)"/>
  <path d="M-60 500C180 390 325 610 590 482s422-57 690-238" fill="none" stroke="url(#chrome)" stroke-width="18" stroke-linecap="round" opacity=".92"/>
  <g transform="translate(620 100) rotate(2 230 205)">
    <rect width="485" height="408" rx="25" fill="#0a1117" stroke="#bfcad3" stroke-opacity=".52" stroke-width="2"/>
    <rect x="18" y="18" width="142" height="372" rx="16" fill="#101820" stroke="#8fafc5" stroke-opacity=".32"/>
    <rect x="176" y="18" width="291" height="248" rx="16" fill="#081016" stroke="#8fafc5" stroke-opacity=".3"/>
    <rect x="176" y="282" width="291" height="108" rx="16" fill="#101820" stroke="#8fafc5" stroke-opacity=".3"/>
    <g fill="#bfcad3" opacity=".72"><rect x="36" y="50" width="104" height="12" rx="6"/><rect x="36" y="89" width="82" height="9" rx="4"/><rect x="36" y="123" width="92" height="9" rx="4"/><rect x="36" y="157" width="70" height="9" rx="4"/></g>
    <rect x="258" y="112" width="130" height="58" rx="29" fill="url(#chrome)"/>
    <text x="323" y="148" text-anchor="middle" fill="#101820" font-family="Arial, sans-serif" font-size="18" font-weight="700">Get started</text>
    <g fill="#8fafc5" opacity=".7"><rect x="196" y="306" width="126" height="8" rx="4"/><rect x="196" y="328" width="230" height="7" rx="3"/><rect x="196" y="349" width="190" height="7" rx="3"/></g>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="74" y="128" fill="#f3f7f8" font-size="34" font-weight="800" letter-spacing="2">UIVEX</text>
    <circle cx="207" cy="110" r="5" fill="#bfcad3"/>
    <text x="72" y="238" fill="#f3f7f8" font-size="64" font-weight="800">Interactive React</text>
    <text x="72" y="310" fill="#e8eff4" font-size="64" font-weight="800">components.</text>
    <text x="75" y="365" fill="#93a5af" font-size="24">Preview. Customize. Copy reusable source.</text>
    <rect x="74" y="418" width="238" height="58" rx="29" fill="url(#chrome)"/>
    <text x="193" y="455" text-anchor="middle" fill="#101820" font-size="18" font-weight="700">Explore the library</text>
  </g>
</svg>
